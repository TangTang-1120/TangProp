# TangProp + 原站点（tangtang-workbench）共存配置

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name tangtangcello.com www.tangtangcello.com 1.14.47.189;
    client_max_body_size 80m;

    # ── TangProp 前端 ──
    location = /tangprop { return 301 /tangprop/; }
    location = /tangprop/ {
        alias /opt/tangprop/backend/static/;
        index index.html;
    }
    location /tangprop/ {
        alias /opt/tangprop/backend/static/;
        try_files $uri $uri/ =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── TangProp API（全部反代到 8080）──
    location ~ ^/(chat|models|tools|memory|auth|health|conversations|image|workbench)(/|$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_buffering off;
    }

    # ── 原站点（Tang Tang 主页，8787）──
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
    }
}

server {
    server_name tangtangcello.com www.tangtangcello.com;
    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/tangtangcello.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tangtangcello.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 80m;

    location = /tangprop { return 301 /tangprop/; }
    location = /tangprop/ {
        alias /opt/tangprop/backend/static/;
        index index.html;
    }
    location /tangprop/ {
        alias /opt/tangprop/backend/static/;
        try_files $uri $uri/ =404;
        expires 7d;
    }

    location ~ ^/(chat|models|tools|memory|auth|health|conversations|image|workbench)(/|$) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 3600;
    }
}
